name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    name: Lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Lint frontend
        run: npm run lint

      - name: Frontend regression tests
        run: npm test

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}

      - name: Cache Tauri bundler tools
        # NSIS (Windows) and AppImage tools (Linux) are downloaded from GitHub
        # while bundling; caching them avoids failing on a GitHub outage.
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/.cache/tauri
            ~/Library/Caches/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-tools-${{ runner.os }}-

      - name: Pre-fetch NSIS tools (Windows)
        # Tauri downloads these from GitHub while bundling and fails on any
        # 5xx. Fetch them first with retries into the folder Tauri checks, so
        # it skips its own download. Versions match what `tauri build` logs
        # for the Tauri CLI in package-lock.json; update them together.
        # Release assets go through `gh release download` (GitHub API) first,
        # because the plain download URLs can 504 while the API still works.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis  = Join-Path $tools 'NSIS'
          $dll   = Join-Path $nsis 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          function Fetch($repo, $tag, $asset, $out) {
            for ($i = 1; $i -le 5; $i++) {
              gh release download $tag -R $repo -p $asset -O $out --clobber
              if ($LASTEXITCODE -eq 0) { return }
              try { Invoke-WebRequest "https://github.com/$repo/releases/download/$tag/$asset" -OutFile $out -UseBasicParsing; return }
              catch { Write-Host "Attempt $i for $asset failed: $_"; Start-Sleep -Seconds (10 * $i) }
            }
            throw "Could not download $asset"
          }
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
            Fetch 'tauri-apps/binary-releases' 'nsis-3.11' 'nsis-3.11.zip' $zip
            New-Item -ItemType Directory -Force $tools | Out-Null
            Remove-Item $nsis -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive $zip -DestinationPath $tools -Force
            Move-Item (Join-Path $tools 'nsis-3.11') $nsis
          }
          if (-not (Test-Path $dll)) {
            New-Item -ItemType Directory -Force (Split-Path $dll) | Out-Null
            Fetch 'tauri-apps/nsis-tauri-utils' 'nsis_tauri_utils-v0.5.3' 'nsis_tauri_utils.dll' $dll
          }
          Get-ChildItem $nsis -Filter makensis.exe | Select-Object FullName, Length
          Get-Item $dll | Select-Object FullName, Length

      - name: Pre-fetch AppImage tools (Linux)
        # Same idea as the NSIS step: Tauri downloads these from GitHub while
        # bundling the AppImage and fails on any 5xx. Fetch them first with
        # retries into ~/.cache/tauri, where Tauri looks before downloading.
        # File names and URLs match tauri-bundler for the Tauri CLI in
        # package-lock.json; update them together.
        # The plain release-download URLs can return 504 for long stretches
        # while the GitHub API still works, so release assets are fetched with
        # `gh release download` (API path) first and the plain URL second.
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e  # one failed tool must not stop the others from being fetched
          tools="$HOME/.cache/tauri"
          mkdir -p "$tools"
          save() { mv "$1.part" "$1" && chmod +x "$1"; }
          fetch_release() {  # <file name> <repo> <tag> <asset>
            local out="$tools/$1" repo="$2" tag="$3" asset="$4"
            [ -s "$out" ] && return 0
            for i in 1 2 3 4 5; do
              rm -f "$out.part"
              gh release download "$tag" -R "$repo" -p "$asset" -O "$out.part" --clobber && save "$out" && return 0
              curl -fsSL -o "$out.part" "https://github.com/$repo/releases/download/$tag/$asset" && save "$out" && return 0
              echo "Attempt $i for $asset failed"; sleep $((10 * i))
            done
            echo "::warning::Could not pre-fetch $1"; return 1
          }
          fetch_raw() {  # <file name> <url>
            local out="$tools/$1"
            [ -s "$out" ] && return 0
            curl -fSL --retry 6 --retry-delay 15 --retry-all-errors -o "$out.part" "$2" && save "$out" \
              || echo "::warning::Could not pre-fetch $1"
          }
          fetch_release AppRun-x86_64 tauri-apps/binary-releases apprun-old AppRun-x86_64
          fetch_release linuxdeploy-x86_64.AppImage tauri-apps/binary-releases linuxdeploy linuxdeploy-x86_64.AppImage
          fetch_raw linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          fetch_raw linuxdeploy-plugin-gstreamer.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          # Optional for Tauri (it falls back to a built-in copy).
          fetch_release linuxdeploy-plugin-appimage.AppImage linuxdeploy/linuxdeploy-plugin-appimage continuous linuxdeploy-plugin-appimage-x86_64.AppImage
          ls -l "$tools"

      - name: Build Tauri app
        id: build
        # A transient download error while bundling is retried once below.
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      - name: Build Tauri app (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
