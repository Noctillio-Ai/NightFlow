name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          # package.json
          node -e "const p=require('./package.json'); p.version='$VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          # src-tauri/tauri.conf.json
          node -e "const c=require('./src-tauri/tauri.conf.json'); c.version='$VERSION'; require('fs').writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c,null,2)+'\n')"
          # src-tauri/Cargo.toml
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Lint frontend
        run: npm run lint

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: Cache Tauri bundler tools
        # NSIS (Windows) and AppImage tools (Linux) are downloaded from GitHub
        # while bundling; caching them avoids failing on a GitHub outage.
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/.cache/tauri
            ~/Library/Caches/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-tools-${{ runner.os }}-

      - name: Pre-fetch NSIS tools (Windows)
        # Tauri downloads these from GitHub while bundling and fails on any
        # 5xx. Fetch them first with retries into the folder Tauri checks, so
        # it skips its own download. Versions match what `tauri build` logs
        # for the Tauri CLI in package-lock.json; update them together.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis  = Join-Path $tools 'NSIS'
          $dll   = Join-Path $nsis 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          function Fetch($url, $out) {
            for ($i = 1; $i -le 6; $i++) {
              try { Invoke-WebRequest $url -OutFile $out -UseBasicParsing; return }
              catch { Write-Host "Attempt $i for $url failed: $_"; Start-Sleep -Seconds (15 * $i) }
            }
            throw "Could not download $url"
          }
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
            Fetch 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' $zip
            New-Item -ItemType Directory -Force $tools | Out-Null
            Remove-Item $nsis -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive $zip -DestinationPath $tools -Force
            Move-Item (Join-Path $tools 'nsis-3.11') $nsis
          }
          if (-not (Test-Path $dll)) {
            New-Item -ItemType Directory -Force (Split-Path $dll) | Out-Null
            Fetch 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' $dll
          }
          Get-ChildItem $nsis -Filter makensis.exe | Select-Object FullName, Length
          Get-Item $dll | Select-Object FullName, Length

      - name: Build Tauri app
        id: build
        # A transient download error while bundling is retried once below.
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      - name: Build Tauri app (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: NightFlow-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NightFlow-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NightFlow-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*-setup.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release/ \;
          echo "Release files:"
          ls -lh release/

      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          # One "<file>.sha256" sidecar per asset (bare hash, no filename column)
          # so nightflow-update.sh can verify downloads.
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          echo "Checksums:"
          ls -lh *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
