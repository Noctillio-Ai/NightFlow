[package]
name = "nightflow"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
serde_yaml = "0.9"
portable-pty = "0.9.0"
hostname = "0.4.2"
tokio = { version = "1", features = ["process", "time", "io-util"] }
window-vibrancy = "0.5"
tauri-plugin-dialog = "2"
tar = "0.4"
flate2 = "1"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
